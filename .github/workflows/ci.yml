name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.example }} (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - advanced-mock-config
          - inversify-jest
          - inversify-vitest
          - nestjs-jest
          - nestjs-vitest
          - injectionjs-jest
          - injectionjs-vitest
        node-version: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - name: Install published packages
        working-directory: ${{ matrix.example }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify Suites package versions and declarations
        run: node scripts/verify-suites.mjs "${{ matrix.example }}"
      - name: Type-check and test
        working-directory: ${{ matrix.example }}
        run: pnpm test
